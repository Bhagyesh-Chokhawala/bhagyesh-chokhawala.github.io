[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome-centric-api-build-standards"
version = "3.0.0"
description = "Centralized dimension-level API policy gates with traffic-light compliance reporting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Bhagyesh Chokhawala"}]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.22", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
api-standards = "api_build_standards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
