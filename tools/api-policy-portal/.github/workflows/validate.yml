name: Central API Policy Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install policy validator
        run: pip install -e ".[dev]"
      - name: Validate policy repository tests
        run: pytest
      - name: Show policy catalog
        run: api-standards catalog
      - name: Run all dimension gates
        run: |
          mkdir -p reports
          set +e
          api-standards validate examples/compliant-api             --json-report reports/api-policy-result.json             --markdown-report reports/api-policy-result.md
          exit_code=$?
          cat reports/api-policy-result.md >> "$GITHUB_STEP_SUMMARY"
          exit $exit_code
      - name: Upload traffic-light reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-policy-reports
          path: reports/
