name: Publish API Policy Portal

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out policy repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validator and portal
        run: pip install -e ".[dev]"

      - name: Create run identity
        id: run
        shell: bash
        run: |
          run_id="$(date -u +%Y%m%dT%H%M%SZ)-policy-repository-${GITHUB_RUN_NUMBER}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          mkdir -p "validation-results/$run_id"

      - name: Capture policy-engine test logs
        id: tests
        shell: bash
        run: |
          set +e
          pytest -q --junitxml "validation-results/${{ steps.run.outputs.run_id }}/test-results.xml" \
            2>&1 | tee "validation-results/${{ steps.run.outputs.run_id }}/tests.log"
          exit_code=${PIPESTATUS[0]}
          echo "$exit_code" > "validation-results/${{ steps.run.outputs.run_id }}/test-exit-code.txt"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture API policy report and validation log
        id: policy
        shell: bash
        run: |
          set +e
          api-standards validate examples/compliant-api \
            --json-report "validation-results/${{ steps.run.outputs.run_id }}/policy-report.json" \
            --markdown-report "validation-results/${{ steps.run.outputs.run_id }}/policy-report.md" \
            2>&1 | tee "validation-results/${{ steps.run.outputs.run_id }}/policy-validation.log"
          exit_code=${PIPESTATUS[0]}
          echo "$exit_code" > "validation-results/${{ steps.run.outputs.run_id }}/policy-exit-code.txt"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write run metadata
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          run_id = os.environ["RUN_ID"]
          metadata = {
              "run_id": run_id,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "timestamp": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "workflow_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }
          Path(f"validation-results/{run_id}/metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          PY

      - name: Restore prior published report history
        shell: bash
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git worktree add previous-site gh-pages
          fi

      - name: Build guidance and reports website
        shell: bash
        run: |
          previous_args=()
          if [ -d previous-site ]; then
            previous_args=(--previous-site previous-site)
          fi
          api-standards portal build \
            --results validation-results \
            --output public \
            "${previous_args[@]}"

      - name: Upload complete evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-policy-validation-${{ steps.run.outputs.run_id }}
          path: validation-results/${{ steps.run.outputs.run_id }}/
          retention-days: 90

      - name: Publish website to gh-pages
        id: deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      - name: Enforce release result after publishing evidence
        if: steps.tests.outputs.exit_code != '0' || steps.policy.outputs.exit_code != '0'
        run: exit 1
