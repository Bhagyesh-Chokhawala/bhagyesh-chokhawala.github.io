openapi: 3.1.0
info:
  title: HDAE Outcome Contract API
  version: 1.0.0
x-hdae:
  capabilityId: CAP-001
  humanIntentRequired: true
  autonomyCeiling: agent-executed
  evidenceRequired: true
paths:
  /outcomes:
    post:
      operationId: requestOutcome
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
        - in: header
          name: X-HDAE-Intent-ID
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestedOutcome, context]
              properties:
                requestedOutcome: { type: string }
                context: { type: object }
      responses:
        '202': { description: Accepted for governed execution }
        '403': { description: Authority or policy denied }
        '409': { description: State/idempotency conflict }
